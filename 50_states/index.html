<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 States Map Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .info-box {
            text-align: center;
        }

        .info-box h3 {
            color: #667eea;
            font-size: 1.2em;
        }

        .info-box p {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .game-area {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .states-list {
            flex: 0 0 250px;
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
        }

        .states-list h2 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .state-chip {
            background: #667eea;
            color: white;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 20px;
            cursor: move;
            user-select: none;
            transition: all 0.3s;
            text-align: center;
            font-weight: 500;
        }

        .state-chip:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .state-chip.dragging {
            opacity: 0.5;
        }

        .state-chip.placed {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .map-container {
            flex: 1;
            position: relative;
            background: #e8f4f8;
            border-radius: 10px;
            overflow: hidden;
            min-height: 600px;
        }

        .map-svg {
            width: 100%;
            height: 100%;
        }

        .state-bg {
            fill: #d0d0d0;
            stroke: #333;
            stroke-width: 1;
            pointer-events: none;
        }

        .state-path {
            fill: transparent;
            stroke: #667eea;
            stroke-width: 2;
            cursor: pointer;
            transition: fill-opacity 0.2s;
        }

        .state-path:hover {
            fill: #ffeb3b;
            fill-opacity: 0.35;
        }

        .state-path.correct {
            fill: #4caf50;
            fill-opacity: 0.7;
            animation: pulse 0.5s;
        }

        .state-path.incorrect {
            fill: #f44336;
            fill-opacity: 0.7;
            animation: shake 0.5s;
        }

        .state-path.drop-zone {
            fill: #ffeb3b;
            fill-opacity: 0.5;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-reset {
            background: #f44336;
            color: white;
        }

        .btn-reset:hover {
            background: #d32f2f;
            transform: scale(1.05);
        }

        .btn-hint {
            background: #2196f3;
            color: white;
        }

        .btn-hint:hover {
            background: #1976d2;
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            animation: slideIn 0.5s;
        }

        @keyframes slideIn {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal h2 {
            color: #4caf50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .modal p {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ 50 States Map Challenge</h1>
        
        <div class="game-info">
            <div class="info-box">
                <h3>Correct</h3>
                <p id="correct-count">0</p>
            </div>
            <div class="info-box">
                <h3>Incorrect</h3>
                <p id="incorrect-count">0</p>
            </div>
            <div class="info-box">
                <h3>Remaining</h3>
                <p id="remaining-count">50</p>
            </div>
        </div>

        <div class="game-area">
            <div class="states-list" id="statesList">
                <h2>Drag States to Map</h2>
                <div id="stateChips"></div>
            </div>

            <div class="map-container" id="mapContainer">
                <svg viewBox="0 0 960 600" class="map-svg" id="mapSvg">
                    <g id="mapBackground">
                        <text x="480" y="300" text-anchor="middle" font-size="20" fill="#999" id="mapLoadingText">
                            Loading map...
                        </text>
                    </g>
                    <g id="dropZones"></g>
                </svg>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-hint" onclick="showHint()">💡 Show Hint</button>
            <button class="btn-reset" onclick="resetGame()">🔄 Reset Game</button>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2>🎉 Congratulations!</h2>
            <p>You've placed all 50 states correctly!</p>
            <p id="finalStats"></p>
            <button class="btn-reset" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <script>
        const states = [
            'Alabama', 'Alaska', 'Arizona', 'Arkansas', 'California',
            'Colorado', 'Connecticut', 'Delaware', 'Florida', 'Georgia',
            'Hawaii', 'Idaho', 'Illinois', 'Indiana', 'Iowa',
            'Kansas', 'Kentucky', 'Louisiana', 'Maine', 'Maryland',
            'Massachusetts', 'Michigan', 'Minnesota', 'Mississippi', 'Missouri',
            'Montana', 'Nebraska', 'Nevada', 'New Hampshire', 'New Jersey',
            'New Mexico', 'New York', 'North Carolina', 'North Dakota', 'Ohio',
            'Oklahoma', 'Oregon', 'Pennsylvania', 'Rhode Island', 'South Carolina',
            'South Dakota', 'Tennessee', 'Texas', 'Utah', 'Vermont',
            'Virginia', 'Washington', 'West Virginia', 'Wisconsin', 'Wyoming'
        ];

        // Simplified state positions (you would use actual SVG paths for production)
        const statePositions = {
            'Alabama': { x: 650, y: 420, abbr: 'AL' },
            'Alaska': { x: 100, y: 520, abbr: 'AK' },
            'Arizona': { x: 200, y: 380, abbr: 'AZ' },
            'Arkansas': { x: 550, y: 400, abbr: 'AR' },
            'California': { x: 120, y: 320, abbr: 'CA' },
            'Colorado': { x: 320, y: 320, abbr: 'CO' },
            'Connecticut': { x: 850, y: 220, abbr: 'CT' },
            'Delaware': { x: 830, y: 280, abbr: 'DE' },
            'Florida': { x: 740, y: 500, abbr: 'FL' },
            'Georgia': { x: 700, y: 420, abbr: 'GA' },
            'Hawaii': { x: 280, y: 540, abbr: 'HI' },
            'Idaho': { x: 220, y: 200, abbr: 'ID' },
            'Illinois': { x: 600, y: 300, abbr: 'IL' },
            'Indiana': { x: 650, y: 300, abbr: 'IN' },
            'Iowa': { x: 530, y: 260, abbr: 'IA' },
            'Kansas': { x: 450, y: 340, abbr: 'KS' },
            'Kentucky': { x: 680, y: 340, abbr: 'KY' },
            'Louisiana': { x: 570, y: 470, abbr: 'LA' },
            'Maine': { x: 880, y: 140, abbr: 'ME' },
            'Maryland': { x: 810, y: 290, abbr: 'MD' },
            'Massachusetts': { x: 860, y: 210, abbr: 'MA' },
            'Michigan': { x: 670, y: 230, abbr: 'MI' },
            'Minnesota': { x: 530, y: 180, abbr: 'MN' },
            'Mississippi': { x: 600, y: 430, abbr: 'MS' },
            'Missouri': { x: 550, y: 330, abbr: 'MO' },
            'Montana': { x: 300, y: 150, abbr: 'MT' },
            'Nebraska': { x: 420, y: 280, abbr: 'NE' },
            'Nevada': { x: 160, y: 280, abbr: 'NV' },
            'New Hampshire': { x: 860, y: 180, abbr: 'NH' },
            'New Jersey': { x: 830, y: 260, abbr: 'NJ' },
            'New Mexico': { x: 310, y: 400, abbr: 'NM' },
            'New York': { x: 810, y: 210, abbr: 'NY' },
            'North Carolina': { x: 760, y: 370, abbr: 'NC' },
            'North Dakota': { x: 420, y: 160, abbr: 'ND' },
            'Ohio': { x: 700, y: 290, abbr: 'OH' },
            'Oklahoma': { x: 470, y: 390, abbr: 'OK' },
            'Oregon': { x: 140, y: 180, abbr: 'OR' },
            'Pennsylvania': { x: 780, y: 270, abbr: 'PA' },
            'Rhode Island': { x: 870, y: 220, abbr: 'RI' },
            'South Carolina': { x: 740, y: 400, abbr: 'SC' },
            'South Dakota': { x: 420, y: 220, abbr: 'SD' },
            'Tennessee': { x: 660, y: 370, abbr: 'TN' },
            'Texas': { x: 450, y: 460, abbr: 'TX' },
            'Utah': { x: 240, y: 310, abbr: 'UT' },
            'Vermont': { x: 840, y: 170, abbr: 'VT' },
            'Virginia': { x: 770, y: 330, abbr: 'VA' },
            'Washington': { x: 140, y: 120, abbr: 'WA' },
            'West Virginia': { x: 740, y: 310, abbr: 'WV' },
            'Wisconsin': { x: 600, y: 210, abbr: 'WI' },
            'Wyoming': { x: 310, y: 240, abbr: 'WY' }
        };

        let correctCount = 0;
        let incorrectCount = 0;
        let placedStates = new Set();
        let draggedState = null;

        function renderMapBackground() {
            const background = document.getElementById('mapBackground');
            const svgNs = 'http://www.w3.org/2000/svg';

            d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json')
                .then(topology => {
                    const geoStates = topojson.feature(topology, topology.objects.states).features;
                    const path = d3.geoPath();

                    background.innerHTML = '';
                    geoStates.forEach(feature => {
                        const stateOutline = document.createElementNS(svgNs, 'path');
                        stateOutline.setAttribute('d', path(feature));
                        stateOutline.classList.add('state-bg');
                        background.appendChild(stateOutline);

                        // Use the real geographic centroid so drop zones sit in the middle of each state
                        const name = feature.properties.name;
                        if (statePositions[name]) {
                            const [x, y] = path.centroid(feature);
                            statePositions[name].x = x;
                            statePositions[name].y = y;
                        }
                    });

                    initGame();
                })
                .catch(() => {
                    document.getElementById('mapLoadingText').textContent = 'Map unavailable - drop zones still work!';
                    initGame();
                });
        }

        function initGame() {
            const chipsContainer = document.getElementById('stateChips');
            const dropZones = document.getElementById('dropZones');
            
            // Clear existing content
            chipsContainer.innerHTML = '';
            dropZones.innerHTML = '';
            
            // Shuffle states
            const shuffledStates = [...states].sort(() => Math.random() - 0.5);
            
            // Create state chips
            shuffledStates.forEach(state => {
                const chip = document.createElement('div');
                chip.className = 'state-chip';
                chip.textContent = state;
                chip.draggable = true;
                chip.dataset.state = state;
                
                chip.addEventListener('dragstart', handleDragStart);
                chip.addEventListener('dragend', handleDragEnd);
                
                chipsContainer.appendChild(chip);
            });
            
            // Create map state zones
            states.forEach(state => {
                const pos = statePositions[state];
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', '10');
                circle.classList.add('state-path');
                circle.dataset.state = state;
                
                circle.addEventListener('dragover', handleDragOver);
                circle.addEventListener('drop', handleDrop);
                circle.addEventListener('dragleave', handleDragLeave);
                
                dropZones.appendChild(circle);
            });
            
            updateStats();
        }

        function handleDragStart(e) {
            if (this.classList.contains('placed')) return;
            
            draggedState = this.dataset.state;
            this.classList.add('dragging');
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedState = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            if (!this.classList.contains('correct')) {
                this.classList.add('drop-zone');
            }
        }

        function handleDragLeave(e) {
            this.classList.remove('drop-zone');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drop-zone');
            
            const targetState = this.dataset.state;
            
            if (draggedState === targetState) {
                // Correct placement
                this.classList.add('correct');
                correctCount++;
                placedStates.add(draggedState);
                
                // Mark chip as placed
                const chip = document.querySelector(`.state-chip[data-state="${draggedState}"]`);
                chip.classList.add('placed');
                chip.draggable = false;
                
                // Check if game is complete
                if (placedStates.size === 50) {
                    setTimeout(showWinModal, 500);
                }
            } else {
                // Incorrect placement
                this.classList.add('incorrect');
                incorrectCount++;
                setTimeout(() => {
                    this.classList.remove('incorrect');
                }, 500);
            }
            
            updateStats();
        }

        function updateStats() {
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('incorrect-count').textContent = incorrectCount;
            document.getElementById('remaining-count').textContent = 50 - placedStates.size;
        }

        function showHint() {
            const unplacedStates = states.filter(s => !placedStates.has(s));
            if (unplacedStates.length > 0) {
                const randomState = unplacedStates[Math.floor(Math.random() * unplacedStates.length)];
                const pos = statePositions[randomState];
                
                // Highlight the state briefly
                const stateCircle = document.querySelector(`.state-path[data-state="${randomState}"]`);
                stateCircle.style.fill = '#ffeb3b';
                setTimeout(() => {
                    stateCircle.style.fill = '';
                }, 2000);
                
                alert(`Hint: Look for ${randomState} (${pos.abbr}) on the map!`);
            }
        }

        function resetGame() {
            correctCount = 0;
            incorrectCount = 0;
            placedStates.clear();
            document.getElementById('winModal').classList.remove('show');
            initGame();
        }

        function showWinModal() {
            const accuracy = ((correctCount / (correctCount + incorrectCount)) * 100).toFixed(1);
            document.getElementById('finalStats').textContent = 
                `Correct: ${correctCount} | Incorrect: ${incorrectCount} | Accuracy: ${accuracy}%`;
            document.getElementById('winModal').classList.add('show');
        }

        // Initialize game on load (initGame runs once the map data resolves)
        renderMapBackground();
    </script>
</body>
</html>
